services:
  - type: web
    name: codeforge-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: DB_CONNECT_STRING
        sync: false
      - key: JWT_KEY
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: REDDIS_HOST
        sync: false
      - key: REDDIS_PORT
        sync: false
      - key: REDDIS_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false
